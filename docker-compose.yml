services:
  postgres:
    image: postgres:16
    container_name: offline-todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: offline_todo
      POSTGRES_USER: offline_todo
      POSTGRES_PASSWORD: offline_todo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offline_todo -d offline_todo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
