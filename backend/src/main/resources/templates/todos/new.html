<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO 登録</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-content">
    <section class="todo-card" aria-labelledby="page-title">
        <div class="page-heading">
            <div>
                <h1 id="page-title">TODO 登録</h1>
                <p class="description">新しい TODO を登録します。</p>
            </div>
            <a class="button-link" th:href="@{/todos}">一覧を見る</a>
        </div>

        <p class="success-message" th:if="${created}" role="status">TODO を登録しました。</p>

        <form th:action="@{/todos}" th:object="${todoCreateForm}" method="post" novalidate>
            <input th:field="*{id}" type="hidden">

            <div class="form-field">
                <label for="title">タイトル</label>
                <input id="title" th:field="*{title}" type="text" maxlength="200" required autofocus>
                <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <button type="submit">登録する</button>
        </form>
    </section>
</main>
</body>
</html>
